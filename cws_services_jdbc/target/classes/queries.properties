# TINVOICES
TINVOICES_SELECT_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_INSERT = INSERT INTO TInvoices \
                   (id, version, number, date, state, subtotal, total, vatRate, vatAmount, usedForVoucher, \
                   createdAt, updatedAt, entityState) \
                   VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FIND_BY_ID = SELECT * FROM TINVOICES WHERE ID = ?
TINVOICES_FIND_BY_NUMBER = SELECT * FROM TINVOICES WHERE NUMBER = ?

# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version, \
                 createdAt, updatedAt, entityState) \
                 values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = delete from TMechanics where id = ?
TMECHANICS_FINDBYNIF = select * from TMechanics where nif = ?
TMECHANICS_FINDALL = select * from TMechanics
TMECHANICS_FINDBYID = select * from TMechanics where id = ?
TMECHANICS_UPDATE = update TMechanics \
                    set name = ?, surname = ?, version = version+1, \
                    updatedat = ? where id = ?


# TWORKORDERS
TWORKORDERS_FIND_NOT_INVOICED = select a.* from TWorkOrders as a, TVehicles as v, \
                                TClients as c \
                                where a.vehicle_id = v.id \
                                and v.client_id = c.id \
                                and state like 'APPROVED' \
                                and nif like ?
TWORKORDERS_FIND_BY_ID = SELECT * FROM TWorkOrders WHERE id = ?
TWORKORDERS_UPDATE = UPDATE TWorkOrders \
                     SET invoice_id = ?, state = ?, version = version + 1, updatedAt = ? \
                     WHERE id = ?
TWORKORDERS_FINDBYMECHANICID = select * from TWorkOrders where mechanic_id = ?

#TINTERVENTIONS
TINTERVENTIONS_FINDBYMECHANICID = SELECT * FROM TInterventions WHERE mechanic_id = ?

#TVOUCHERS
TVOUCHERS_FIND_BY_CLIENT_NIF = SELECT p.id, p.createdAt, p.entitystate, p.version, \
                                p.updatedat, p.version, p.dtype, p.accumulated, \
                                p.client_id, v.code, v.description, v.available \
                                FROM TVouchers v \
                                JOIN TPaymentMeans p on p.id = v.id \
                                JOIN TClients c on p.client_id = c.id \
                                WHERE c.nif = ?

#TPAYMENTMEANS
TPAYMENTMEANS_FIND_BY_CLIENT_NIF = SELECT p.id, p.dtype, p.createdAt, p.entityState, p.updatedAt, \
                                    p.version, p.accumulated, p.client_id, \
                                    cc.number, cc.type, cc.validthru, \
                                    v.code, v.description, v.available \
                                    FROM TPaymentMeans p \
                                    JOIN TClients c ON p.client_id = c.id \
                                    LEFT JOIN TCreditCards cc ON p.id = cc.id \
                                    LEFT JOIN TVouchers v ON p.id = v.id \
                                    WHERE c.nif = ?